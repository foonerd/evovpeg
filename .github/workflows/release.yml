name: release

# A tag builds the release: the workshop pass, every target built with its own proof on a
# machine of its own architecture, then one job that checks each build against its
# manifest, packs the archives, signs them and publishes a pre-release. Run by hand it
# builds and packs everything and publishes nothing; the archives are kept with the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDER_REGISTRY: ghcr.io/${{ github.repository }}-builder
  BUILDER_PUSH: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the tree carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cat VERSION)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, VERSION says $version" >&2; exit 1; }
      - run: scripts/check.sh

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: armv7, runner: ubuntu-24.04-arm }
          - { target: armv8, runner: ubuntu-24.04-arm }
          - { target: x64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./build.sh ${{ matrix.target }}
      - run: bash scripts/network-smoke.sh ${{ matrix.target }}
      - name: Paced encode latency
        if: matrix.target == 'x64'
        run: |
          out/x64/bin/evovpeg -nostdin -v error -i tests/clips/flash-h264.mp4 -an -sn -frames:v 1 -pix_fmt yuv420p -f rawvideo /tmp/peg-frame.yuv
          docker run --rm --network none -v "$PWD:/src:ro" -v /tmp/peg-frame.yuv:/frame:ro node:20-bookworm-slim node /src/tests/measure-encode.cjs /src/out/x64/bin/evovpeg /frame
      - name: Linux x64 frame reference
        if: matrix.target == 'x64'
        run: |
          mkdir -p reference-x64
          out/x64/bin/evovpeg -nostdin -v error -threads 1 -i tests/clips/flash-h264.mp4 -frames:v 60 -an -sn -pix_fmt yuv420p -f rawvideo - > reference-x64/flash-h264.yuv
          out/x64/bin/evovpeg -nostdin -v error -stream_loop 29 -i tests/clips/flash-h264.mp4 -t 60 -an -c:v copy -f mp4 reference-x64/range.mp4
          test "$(stat -c %s reference-x64/range.mp4)" -gt 32768
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x64'
        with:
          name: evovpeg-reference-x64
          path: reference-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: evovpeg-${{ matrix.target }}
          path: out/${{ matrix.target }}
          if-no-files-found: error

  cross:
    name: windows-x64 cross-build
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./build.sh windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: evovpeg-windows-x64
          path: out/windows-x64
          if-no-files-found: error

  android:
    name: ${{ matrix.target }}
    needs: cross
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [android-armeabi-v7a, android-arm64-v8a, android-x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: evovpeg-${{ matrix.target }}
          path: out/${{ matrix.target }}
          if-no-files-found: error

  windows-smoke:
    name: Windows native smoke
    needs: [build, cross]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: actions/download-artifact@v8
        with:
          name: evovpeg-windows-x64
          path: out/windows-x64
      - uses: actions/download-artifact@v8
        with:
          name: evovpeg-reference-x64
          path: reference-x64
      - name: Verify the native Windows build
        shell: bash
        run: |
          chmod 755 out/windows-x64/bin/evovpeg.exe out/windows-x64/bin/evovprobe.exe
          bash scripts/verify-set.sh out/windows-x64/bin/evovpeg.exe . out/windows-x64/bin/evovprobe.exe windows-x64
          bash scripts/smoke.sh out/windows-x64/bin/evovpeg.exe out/windows-x64/bin/evovprobe.exe tests/clips tests/clips/vvc-synthetic.266 /tmp/windows-smoke windows-x64
          node tests/smoke-windows.cjs out/windows-x64/bin/evovpeg.exe out/windows-x64/bin/evovprobe.exe tests/clips/flash-h264.mp4 reference-x64/flash-h264.yuv reference-x64/range.mp4

  android-smoke:
    name: Android x86_64 emulator smoke
    needs: [build, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: evovpeg-android-x86_64
          path: out/android-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: evovpeg-reference-x64
          path: reference-x64
      - name: Boot the Android x86_64 runtime and verify decode parity
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name evovpeg --package "system-images;android-35;google_apis;x86_64" --force
          "$ANDROID_HOME/emulator/emulator" -avd evovpeg -no-window -no-audio -no-boot-anim -no-snapshot -accel auto > /tmp/evovpeg-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 120 adb wait-for-device
          booted=
          attempt=0
          while [[ "$booted" != 1 && "$attempt" -lt 120 ]]; do
            booted=$(adb shell getprop sys.boot_completed | tr -d '\r')
            attempt=$((attempt + 1))
            [[ "$booted" == 1 ]] || sleep 2
          done
          [[ "$booted" == 1 ]]
          bash scripts/smoke-android.sh android-x86_64 out/android-x86_64/bin tests/clips/flash-h264.mp4 reference-x64/flash-h264.yuv

  publish:
    name: pack, sign, publish
    needs: [build, cross, android, windows-smoke, android-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: evovpeg-*
          path: artifacts
      - name: What the builds made, where package.sh looks for it
        run: |
          mkdir -p out
          for t in armv7 armv8 x64 windows-x64 android-armeabi-v7a android-arm64-v8a android-x86_64; do mv "artifacts/evovpeg-$t" "out/$t"; done
          ls -la out/*/bin
      # The x64 build runs here: proven once more after its trip through the artifact store.
      - name: The x64 binary, as it arrived
        run: |
          chmod 755 out/x64/bin/evovpeg out/x64/bin/evovprobe
          scripts/verify-set.sh out/x64/bin/evovpeg . out/x64/bin/evovprobe x64
      # Every file of every build is checked against the digest its build.json recorded.
      - run: scripts/package.sh
      - name: Corresponding source
        run: |
          scripts/fetch-sources.sh
          bash scripts/package-sources.sh
      # Every archive carries MANIFEST and its signature; SHA256SUMS and its signature
      # stand beside them. The private key comes from the repository's secret
      # RELEASE_SIGNING_KEY (the Ed25519 key as PEM); the public key the consumers carry
      # (keys/release-signing.pub) checks every signature before anything is published.
      # An evovpeg release is never published unsigned.
      - name: Sign the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: a release of evovpeg is never published unsigned" >&2
            exit 1
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - uses: actions/upload-artifact@v7
        with:
          name: evovpeg-release
          path: dist
          if-no-files-found: error
      # Published as a pre-release: a consumer pins a version by hand once it has been
      # tried. It is made the latest by hand (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          { scripts/release-notes.sh "$version"; printf '\n'; cat .github/release-footer.md; } > dist/notes.md
          gh release create "$GITHUB_REF_NAME" --title "evovpeg $version" --notes-file dist/notes.md --prerelease \
            dist/evovpeg-*.tar.gz dist/evovpeg-*.zip dist/evovpeg-sources-*.tar.xz dist/manifest.json dist/SHA256SUMS dist/SHA256SUMS.sig
