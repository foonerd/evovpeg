name: release

# A tag builds the release: the workshop pass, every target built with its own proof on a
# machine of its own architecture, then one job that checks each build against its
# manifest, packs the archives, signs them and publishes a pre-release. Run by hand it
# builds and packs everything and publishes nothing; the archives are kept with the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDER_REGISTRY: ghcr.io/${{ github.repository }}-builder
  BUILDER_PUSH: 1

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version the tree carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cat VERSION)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, VERSION says $version" >&2; exit 1; }
      - run: scripts/check.sh

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: armv7, runner: ubuntu-24.04-arm }
          - { target: armv8, runner: ubuntu-24.04-arm }
          - { target: x64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: ./build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: evovpeg-${{ matrix.target }}
          path: out/${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: pack, sign, publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: evovpeg-*
          path: artifacts
      - name: What the builds made, where package.sh looks for it
        run: |
          mkdir -p out
          for t in armv7 armv8 x64; do mv "artifacts/evovpeg-$t" "out/$t"; done
          ls -la out/*/bin
      # The x64 build runs here: proven once more after its trip through the artifact store.
      - name: The x64 binary, as it arrived
        run: |
          chmod 755 out/x64/bin/evovpeg out/x64/bin/evovprobe
          scripts/verify-set.sh out/x64/bin/evovpeg . out/x64/bin/evovprobe
      # Every file of every build is checked against the digest its build.json recorded.
      - run: scripts/package.sh
      # Every archive carries MANIFEST and its signature; SHA256SUMS and its signature
      # stand beside them. The private key comes from the repository's secret
      # RELEASE_SIGNING_KEY (the Ed25519 key as PEM); the public key the consumers carry
      # (keys/release-signing.pub) checks every signature before anything is published.
      # An evovpeg release is never published unsigned.
      - name: Sign the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY in this repository: a release of evovpeg is never published unsigned" >&2
            exit 1
          fi
          scripts/sign-release.sh dist keys/release-signing.pub
      - uses: actions/upload-artifact@v7
        with:
          name: evovpeg-release
          path: dist
          if-no-files-found: error
      # Published as a pre-release: a consumer pins a version by hand once it has been
      # tried. It is made the latest by hand (gh release edit <tag> --prerelease=false --latest).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          { scripts/release-notes.sh "$version"; printf '\n'; cat .github/release-footer.md; } > dist/notes.md
          gh release create "$GITHUB_REF_NAME" --title "evovpeg $version" --notes-file dist/notes.md --prerelease \
            dist/evovpeg-*.tar.gz dist/manifest.json dist/SHA256SUMS dist/SHA256SUMS.sig
